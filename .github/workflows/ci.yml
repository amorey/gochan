name: ci

permissions:
  contents: read

on:
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26
      - name: Run linter
        run: test -z "$(gofmt -l .)"

  vet:
    name: Vet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26
      - name: Run vetter
        run: go vet ./...

  test:
    name: Test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go-version: [1.21, 1.22, 1.23, 1.24, 1.25, 1.26]
        gomaxprocs: [1, 2, 8]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - name: Run tests
        env:
          GOMAXPROCS: ${{ matrix.gomaxprocs }}
        run: go test -race ./...

  coverage:
    name: Coverage (100%)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26
      - name: Run coverage
        run: go test -coverpkg=./... -coverprofile=cov.out ./...
      - name: Enforce 100% coverage on library packages
        run: |
          set -euo pipefail
          go tool cover -func=cov.out | tail -1
          uncovered=$(go tool cover -func=cov.out | awk '$3 != "100.0%" && $3 != "" && $1 !~ /examples/ && $1 !~ /^total:/')
          if [ -n "$uncovered" ]; then
            echo "Coverage below 100% on library packages:"
            echo "$uncovered"
            exit 1
          fi
          echo "All library packages at 100.0% coverage."
